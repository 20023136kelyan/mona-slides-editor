name: test

on:
  # `main`, not `master`. This said `master` while the default branch was `main`,
  # so no push ever matched it and, with no pull requests either, the pipeline
  # had never run once — `gh run list` was empty on a repository with 36 commits
  # of migration in it.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Mona-owned checks: architecture boundaries, typecheck, lint, unit/browser
  # tests, application journeys, and the production build.
  #
  # Two runners, because Mona now has two chromes and each hides the other's.
  # macOS is what ships and carries everything platform-specific — the traffic
  # lights, the hidden title bar, the system menu bar, and the rail width
  # measured off them. Linux is where the in-window menu bar lives, which macOS
  # never renders. A suite run on one of them alone tests half the application:
  # that is exactly how a menu helper that could only ever work on macOS reached
  # the default branch unnoticed.
  app:
    strategy:
      # Both run to completion. A failure on one platform is a fact worth having
      # about that platform, not a reason to stop learning about the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Architecture boundaries
        run: npm run check:architecture

      - name: Lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npm exec -w @mona/web -- playwright install --with-deps chromium

      - name: Unit and browser tests
        run: npm exec -w @mona/web -- vitest run

      - name: Core package tests
        run: npm run test:core

      - name: Agent server tests
        run: npm run test:agent

      # Electron needs a display, and only Linux has to invent one. The
      # globalSetup builds the shell bundle, so there is nothing else to add.
      - name: App e2e (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -w @mona/web -- playwright test

      - name: App e2e (macOS)
        if: runner.os == 'macOS'
        run: npm exec -w @mona/web -- playwright test

      - name: Production build
        run: npm run build

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-artifacts-${{ matrix.os }}
          path: apps/web/test-results/
          retention-days: 7
