name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Mona-owned checks: architecture boundaries, typecheck, lint, unit/browser
  # tests, application journeys, and the production build.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Architecture boundaries
        run: npm run check:architecture

      - name: Lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npm exec -w @mona/web -- playwright install --with-deps chromium

      - name: Unit and browser tests
        run: npm exec -w @mona/web -- vitest run

      - name: Core package tests
        run: npm run test:core

      - name: Agent server tests
        run: npm run test:agent

      # Electron needs a display. The globalSetup builds the shell bundle, so
      # there is nothing to add here beyond the frame buffer.
      - name: App e2e
        run: xvfb-run --auto-servernum npm exec -w @mona/web -- playwright test

      - name: Production build
        run: npm run build

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-artifacts
          path: apps/web/test-results/
          retention-days: 7
